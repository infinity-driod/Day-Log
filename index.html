<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#DCEBFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Day Log</title>
<script>try{document.documentElement.dataset.t=localStorage.getItem('dls:t')||'blue'}catch(e){}</script>
<style>
:root{--a:#1F6FEB;--a2:#8DBBFF;--g1:#DCEBFF;--bg:#F5F9FF;--ink:#0B1B33;--mute:#6B7A90;--sub:#2F5FA8;--red:#C0392B;--bd:color-mix(in srgb,var(--a) 16%,transparent);color-scheme:light only;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-t=pink]{--a:#FF2D78;--a2:#FF86B5;--g1:#FFD9E8;--bg:#FFF5F9;--sub:#B83A72}
[data-t=green]{--a:#0E9F6E;--a2:#6FD3AC;--g1:#D8F3E6;--bg:#F3FBF7;--sub:#1B7A57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--g1) 0,var(--bg) 320px) no-repeat var(--bg);color:var(--ink);font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding:0 16px 40px;-webkit-font-smoothing:antialiased}
body[data-v=day]{padding-bottom:260px}
main{max-width:560px;margin:0 auto}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid color-mix(in srgb,var(--a) 50%,transparent);outline-offset:2px}
svg{display:block}
.top{display:flex;justify-content:space-between;height:44px;align-items:center}
.nav{width:44px;height:44px;display:grid;place-items:center;color:var(--a)}
.nav svg{width:12px;height:20px}.nav:disabled{color:#C6CBD3;cursor:default}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700}
.sub{color:var(--sub);font-size:15px;margin:2px 0 18px}
.card{background:rgba(255,255,255,.92);border:1px solid var(--bd);border-radius:18px;box-shadow:0 8px 26px color-mix(in srgb,var(--a) 13%,transparent)}
.sum{padding:16px}.lbl{font-size:13px;color:var(--mute)}
.total{color:var(--a);font-size:40px;line-height:1.1;font-weight:700;margin:2px 0 14px}
.total small{font-size:15px;font-weight:400;color:var(--mute);margin-left:8px}
.seg{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--bd)}.seg i{display:block;height:100%}
.leg{list-style:none;margin:14px 0 0;padding:0}.leg li{display:flex;align-items:center;gap:10px;padding:6px 0}
.leg b{width:10px;height:10px;border-radius:50%;flex:none}.leg span{flex:1;min-width:0;overflow-wrap:anywhere}.leg em{font-style:normal;color:var(--mute)}
h2{margin:26px 0 7px 16px;font-size:13px;font-weight:400;color:var(--sub);text-transform:uppercase;letter-spacing:.2px}
.wk h2,.lh{display:flex;justify-content:space-between;align-items:center;margin-right:16px}
.log{list-style:none;margin:0;padding:0;overflow:hidden}
.log li{position:relative;display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 6px 8px 14px}
.log li+li::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--bd)}
.tile{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:19px}
.main{flex:1;min-width:0;text-align:left;padding:4px 0}.main div{overflow-wrap:anywhere}.main small{color:var(--mute);font-size:13px}
.done .main div{color:var(--mute)}
.dur{color:var(--mute);white-space:nowrap;font-size:15px}
.chk{flex:none;width:44px;height:44px;display:grid;place-items:center}
.chk svg{width:26px;height:26px;border-radius:50%;border:2px solid var(--a2);color:transparent;padding:3px}
.chk.on svg{background:var(--a);border-color:var(--a);color:#fff}
.empty{padding:22px 16px;color:var(--mute);text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--bd);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock>div{max-width:560px;margin:0 auto}
#say{margin:0 0 6px;font-size:13px;color:var(--mute);text-align:center;min-height:17px}
.bdr{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--sub);margin:0 0 8px}
.bdr input{border:1px solid var(--bd);border-radius:8px;padding:3px 8px;background:#fff;font-size:15px}
.ctl{display:flex;gap:12px;align-items:center}
#mic{flex:none;width:68px;height:68px;border-radius:50%;background:linear-gradient(160deg,var(--a2),var(--a));box-shadow:0 0 0 6px color-mix(in srgb,var(--a) 14%,transparent),0 10px 26px color-mix(in srgb,var(--a) 40%,transparent);color:#fff;display:grid;place-items:center}
#mic svg{width:28px;height:28px}
#mic.on{background:var(--red);box-shadow:0 0 0 7px color-mix(in srgb,var(--red) 22%,transparent)}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;gap:6px;background:#fff;border:.5px solid var(--bd);border-radius:22px;padding:5px 5px 5px 14px}
#box{flex:1;min-width:0;height:44px;max-height:120px;border:0;resize:none;background:none;padding:10px 0;line-height:1.25}
#box:focus-visible{outline:0}
#go{flex:none;width:34px;height:34px;margin-bottom:5px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center}
#go svg{width:16px;height:16px}
.priv{padding:16px;font-size:15px}.priv p{margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}.opt input{width:22px;height:22px;accent-color:var(--a);flex:none;margin:0}
.wipe{color:var(--red);font-size:16px;font-weight:600;min-height:44px}
.seg2{display:flex;background:var(--bd);border-radius:10px;padding:2px;margin:4px 0 14px}
.seg2 button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:600}
.seg2 button.on{background:#fff;box-shadow:0 1px 4px color-mix(in srgb,var(--a) 25%,transparent)}
.th{display:flex;gap:8px}.th button{flex:1;height:44px;border-radius:12px;border:2px solid transparent;background:#fff;font-weight:600;box-shadow:0 0 0 1px var(--bd)}
.th button::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--c);margin-right:8px}
.th button.on{border-color:var(--a)}
.dl{display:flex;gap:8px}.dl button,.pri{background:var(--a);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;min-height:36px}
dialog{border:0;border-radius:20px;padding:18px;width:min(92vw,420px);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,25,50,.4)}
.dt{font-size:20px;font-weight:700;margin-bottom:10px}
.fl{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
.in{display:block;width:100%;margin-top:4px;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;background:#fff;font-size:16px;color:var(--ink)}
.bt{display:flex;gap:8px;align-items:center;margin-top:14px}.bt span{flex:1}.bt #cx{padding:8px 12px;color:var(--sub);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="top" data-s="day week">
    <button class="nav" id="prev" aria-label="Previous"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>
    <button class="nav" id="next" aria-label="Next"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg></button>
  </div>
  <div class="seg2"><button data-v="day">Day</button><button data-v="week">Week</button><button data-v="list">List</button><button data-v="set">Settings</button></div>
  <h1 id="title"></h1>
  <div class="sub" id="date"></div>
  <section class="card sum" data-s="day week">
    <div class="lbl">Time tracked</div>
    <div class="total"><span id="total">0m</span><small id="count"></small></div>
    <div class="seg" id="seg"></div>
    <ul class="leg" id="leg"></ul>
  </section>
  <div data-s="day"><h2>Activity log</h2><ul class="card log" id="log"></ul></div>
  <div class="wk" id="wk" data-s="week"></div>
  <div data-s="list">
    <div class="lh"><h2 style="margin-right:0">Every entry</h2><div class="dl"><button id="dtx">Download .txt</button><button id="dcs">.csv</button></div></div>
    <ul class="card log" id="all"></ul>
  </div>
  <div data-s="set">
    <h2>Appearance</h2>
    <section class="card priv"><div class="th" id="th"><button data-t="blue" style="--c:#1F6FEB">Blue</button><button data-t="green" style="--c:#0E9F6E">Green</button><button data-t="pink" style="--c:#FF2D78">Pink</button></div></section>
    <h2>Voice</h2>
    <section class="card priv">
      <label class="opt"><input type="checkbox" id="lv"><span>Keep voice on this device. Private, and works offline where your browser supports it.</span></label>
      <label class="opt"><input type="checkbox" id="vo"><span>If on-device voice isn’t available, allow online voice (Apple or Google may process the audio)</span></label>
      <p class="lbl" id="off"></p>
    </section>
    <h2>Privacy</h2>
    <section class="card priv">
      <p>Entries stay on this phone. This page can’t send anything over the internet.</p>
      <button class="wipe" id="wipe">Erase all entries on this phone</button>
    </section>
  </div>
</main>
<div class="dock" data-s="day"><div>
  <p id="say" aria-live="polite">Tap the mic and speak, or type below. No limit on length.</p>
  <label class="bdr">Begins <input type="date" id="bd"></label>
  <div class="ctl">
    <button id="mic" aria-label="Start talking"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M5.5 10.5a1 1 0 0 1 2 0v.5a4.5 4.5 0 0 0 9 0v-.5a1 1 0 0 1 2 0v.5a6.5 6.5 0 0 1-5.5 6.42V20h2a1 1 0 0 1 0 2h-6a1 1 0 0 1 0-2h2v-2.58A6.5 6.5 0 0 1 5.5 11v-.5Z"/></svg></button>
    <div class="field">
      <textarea id="box" placeholder="Or type here" aria-label="Describe an activity"></textarea>
      <button id="go" aria-label="Log it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    </div>
  </div>
</div></div>
<dialog id="ed">
  <div class="dt">Edit entry</div>
  <label class="fl">What you did<textarea id="et" class="in" rows="3"></textarea></label>
  <label class="fl">Minutes spent<input id="em" class="in" type="number" min="0" inputmode="numeric"></label>
  <label class="fl">Began<input id="es" class="in" type="date"></label>
  <label class="fl">Finished (leave empty if not done)<input id="ef" class="in" type="date"></label>
  <div class="bt"><button id="dlt" class="wipe">Delete</button><span></span><button id="cx">Cancel</button><button id="sv" class="pri">Save</button></div>
</dialog>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const say=t=>{$('#say').textContent=t};
const fd=s=>{if(!s)return'';const[y,m,d]=s.split('-'),n=new Date(y,m-1,d);return n.toLocaleDateString(undefined,{month:'short',day:'numeric',year:+y===new Date().getFullYear()?undefined:'numeric'})};
const G=k=>{try{return localStorage.getItem(k)}catch(e){return null}},S=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const PAL=['#1F6FEB','#8E5CF7','#F59E0B','#14B8A6','#EF4444','#22C55E','#EC4899','#0EA5E9'];
const colorFor=s=>{let h=0;for(const c of s.toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const EM=[[/meet|call|zoom|sync/,'📞'],[/mail|inbox/,'✉️'],[/report|write|draft|doc/,'📝'],[/lunch|eat|coffee|break/,'☕️'],[/code|debug|build|develop/,'💻'],[/review|check/,'🔍'],[/plan|strategy|schedule/,'🗓️'],[/travel|drive|commute/,'🚗']];
const iconFor=s=>{const m=EM.find(([r])=>r.test(s.toLowerCase()));return m?m[1]:'📝'};
const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
let day=new Date(),entries=[],mode='day';
let voiceOn=G('dls:vo')==='1'||G('daylog:voice')==='1',localV=G('dls:lv')!=='0';

const getDay=k=>{try{return JSON.parse(G('daylog:'+k))||[]}catch(e){return[]}};
function setDay(k,a){try{a.length?localStorage.setItem('daylog:'+k,JSON.stringify(a)):localStorage.removeItem('daylog:'+k)}catch(e){say('Couldn’t save on this device. Entries may be lost when you close the page.')}}
const dayKeys=()=>{try{return Object.keys(localStorage).filter(k=>/^daylog:\d{4}-\d\d-\d\d$/.test(k)).map(k=>k.slice(7))}catch(e){return[]}};
function allEntries(){return dayKeys().flatMap(k=>getDay(k).map(e=>({e,k}))).sort((a,b)=>(b.e.start||b.k).localeCompare(a.e.start||a.k)||String(b.e.id).localeCompare(String(a.e.id)))}
function mut(k,id,fn){const a=getDay(k),x=a.find(y=>y.id===id);if(x)fn(x);setDay(k,a);load()}

const wkStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function weekData(){const s=wkStart(day),out=[];for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);out.push({d,k:key(d),en:getDay(key(d))})}return out}
function summary(list){
  const total=list.reduce((a,e)=>a+(e.mins||0),0);
  $('#total').textContent=fmt(total);
  $('#count').textContent=list.length+(list.length===1?' entry':' entries');
  const g=new Map();
  for(const e of list){const k=e.task.toLowerCase(),o=g.get(k)||{label:e.task,mins:0};o.mins+=e.mins||0;g.set(k,o)}
  const rows=[...g.values()].filter(o=>o.mins>0).sort((a,b)=>b.mins-a.mins),seg=$('#seg'),leg=$('#leg');
  seg.replaceChildren();leg.replaceChildren();
  for(const o of rows){
    const c=colorFor(o.label),i=el('i');i.style.width=(o.mins/total*100)+'%';i.style.background=c;seg.append(i);
    const li=el('li'),d=el('b');d.style.background=c;li.append(d,el('span',0,o.label),el('em',0,fmt(o.mins)));leg.append(li);
  }
}
function row(e,k){
  const li=el('li',e.done?'done':''),t=el('span','tile',e.icon||iconFor(e.task));
  t.style.background='color-mix(in srgb,'+colorFor(e.task)+' 16%,white)';
  const m=el('button','main');m.append(el('div',0,e.task),el('small',0,'Began '+fd(e.start||k)+' · '+(e.done?'Finished '+fd(e.done):'In progress')));
  m.onclick=()=>openEd(e,k);
  const c=el('button','chk'+(e.done?' on':''));c.innerHTML=CHK;c.setAttribute('aria-label',e.done?'Mark not finished':'Mark finished');
  c.onclick=()=>mut(k,e.id,x=>{x.done=x.done?null:key(new Date())});
  li.append(t,m,el('span','dur',e.mins?fmt(e.mins):''),c);return li;
}
function render(){
  document.body.dataset.v=mode;
  document.querySelectorAll('[data-s]').forEach(n=>n.hidden=!n.dataset.s.split(' ').includes(mode));
  document.querySelectorAll('.seg2 button').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));
  const now=new Date(),short={month:'short',day:'numeric'};
  if(mode==='day'){
    const today=key(day)===key(now);
    $('#title').textContent=today?'Today':day.toLocaleDateString(undefined,{weekday:'long'});
    $('#date').textContent=day.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
    $('#next').disabled=today;summary(entries);
    const ll=$('#log');ll.replaceChildren();
    if(!entries.length)ll.append(el('li','empty','Nothing logged yet. Tap the mic and say what you did.'));
    for(const e of entries)ll.append(row(e,key(day)));
  }else if(mode==='week'){
    const w=weekData(),s=w[0].d,cur=key(wkStart(now))===key(s);
    $('#title').textContent=cur?'This week':'Week of '+s.toLocaleDateString(undefined,short);
    $('#date').textContent=s.toLocaleDateString(undefined,short)+' – '+w[6].d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    $('#next').disabled=cur||s>now;
    const all=w.flatMap(x=>x.en);summary(all);
    const box=$('#wk');box.replaceChildren();
    for(const x of w){
      if(!x.en.length)continue;
      const tot=x.en.reduce((a,e)=>a+(e.mins||0),0),h=el('h2');
      h.append(el('span',0,x.d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})),el('span',0,tot?fmt(tot):''));
      const ul=el('ul','card log');for(const e of x.en)ul.append(row(e,x.k));box.append(h,ul);
    }
    if(!all.length)box.append(el('div','empty','Nothing logged this week.'));
  }else if(mode==='list'){
    const A=allEntries(),u=$('#all'),open=A.filter(x=>!x.e.done).length;
    $('#title').textContent='All entries';
    $('#date').textContent=A.length+(A.length===1?' entry':' entries')+(A.length?' · '+open+' in progress':'');
    u.replaceChildren();
    if(!A.length)u.append(el('li','empty','No entries yet.'));
    for(const x of A)u.append(row(x.e,x.k));
  }else{$('#title').textContent='Settings';$('#date').textContent='Appearance, voice and privacy'}
}
function load(){entries=getDay(key(day));$('#bd').value=key(day);render()}

// edit
let ek=null,eid=null;
function openEd(e,k){ek=k;eid=e.id;$('#et').value=e.task;$('#em').value=e.mins||'';$('#es').value=e.start||k;$('#ef').value=e.done||'';$('#ed').showModal()}
$('#sv').onclick=()=>{const t=$('#et').value.trim(),m=+$('#em').value||null,s=$('#es').value||ek,f=$('#ef').value||null;
  mut(ek,eid,x=>{if(t){x.task=t;x.icon=iconFor(t)}x.mins=m;x.start=s;x.done=f});$('#ed').close()};
$('#dlt').onclick=()=>{if(!confirm('Delete this entry?'))return;setDay(ek,getDay(ek).filter(x=>x.id!==eid));$('#ed').close();load()};
$('#cx').onclick=()=>$('#ed').close();

// parse + add (no length limits)
function dur(s){
  let m=0,r=s;
  r=r.replace(/an hour and a half|one and a half hours?/gi,()=>{m+=90;return' '});
  r=r.replace(/half an hour|half hour/gi,()=>{m+=30;return' '});
  r=r.replace(/\b(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)(?:\s*(?:and\s*)?(\d+)\s*(?:minutes?|mins?))?/gi,(_,h,mi)=>{m+=parseFloat(h)*60+(mi?+mi:0);return' '});
  r=r.replace(/\b(\d+)\s*(?:minutes?|mins?)\b/gi,(_,n)=>{m+=+n;return' '});
  r=r.replace(/\b(?:an|one) hour\b/gi,()=>{m+=60;return' '});
  return{m:m||null,rest:r};
}
function clean(s,orig){
  let t=s.replace(/\s+/g,' ').trim(),p;
  const lead=/^(?:i|i’m|i'm|i’ve|i've|just|spent|spend|worked|working|on|for|about|around|and|had|did|doing|was|in|at|a bit|some)\b[\s,]*/i;
  do{p=t;t=t.replace(lead,'')}while(t!==p);
  t=t.replace(/[\s,]*\b(?:for|about|around)\s*$/i,'').replace(/^[\s,]+|[\s,]+$/g,'');
  if(!t)t=orig.trim();
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function parse(text){
  const parts=text.split(/\s*(?:\band then\b|\bthen\b|\bafter that\b|\bafterwards\b|[.;])\s*/i).map(x=>x.trim()).filter(Boolean);
  return(parts.length?parts:[text]).map(p=>{const d=dur(p),task=clean(d.rest,p);return{task,minutes:d.m,icon:iconFor(task)}});
}
const rs=()=>{const b=$('#box');b.style.height='44px';b.style.height=Math.min(b.scrollHeight,120)+'px'};
function submit(){
  const text=$('#box').value.trim();if(!text)return;
  const at=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),start=$('#bd').value||key(day);
  for(const it of parse(text))entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at,task:it.task,mins:it.minutes,icon:it.icon,start,done:null});
  $('#box').value='';rs();setDay(key(day),entries);load();say('Logged. Tap the mic for the next one.');
}
$('#box').oninput=rs;$('#go').onclick=submit;

// voice: continuous, on-device when supported
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,want=false,base='',got=false;
const kb=m=>{$('#box').focus();say(m||'Tap the microphone key on your keyboard, speak, then tap the arrow.')};
$('#mic').onclick=()=>{
  if(want){want=false;rec.stop();return}
  const off=!navigator.onLine,P=!!SR&&'processLocally' in SR.prototype,loc=P&&(localV||off);
  if(!SR||(!loc&&(off||!voiceOn)))return kb(off?'You’re offline. Use your keyboard’s mic key (works offline if Dictation is on).':0);
  rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=true;
  if(loc)rec.processLocally=true;
  base=$('#box').value.trim();got=false;want=true;
  rec.onstart=()=>{$('#mic').classList.add('on');say('Listening… tap again when you’re done.')};
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript+' ';got=true;$('#box').value=(base?base+' ':'')+t.trim();rs()};
  rec.onerror=e=>{
    const f=['not-allowed','service-not-allowed','language-not-supported'].includes(e.error);if(f)want=false;
    if(e.error==='no-speech'||e.error==='aborted')return;
    say(e.error==='language-not-supported'?'On-device speech isn’t installed for your language. Use your keyboard’s mic key.':f?'Mic is blocked. Use your keyboard’s mic in the box instead.':'Voice problem: '+e.error);
  };
  rec.onend=()=>{
    if(want){base=$('#box').value.trim();try{rec.start();return}catch(x){want=false}}
    $('#mic').classList.remove('on');if(got)submit();
  };
  try{rec.start()}catch(e){want=false;say('Couldn’t start the mic.')}
};

// export
function exp(kind){
  const L=allEntries().reverse(),stamp=key(new Date());
  const st=x=>x.e.done?'Finished '+x.e.done:'In progress',bg=x=>x.e.start||x.k;
  let txt,name,type;
  if(kind==='csv'){
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    txt=['Task,Minutes,Began,Finished,Logged at,Status',...L.map(x=>[q(x.e.task),x.e.mins||'',bg(x),x.e.done||'',q(x.e.at||''),st(x)].join(','))].join('\n');
    name='day-log-'+stamp+'.csv';type='text/csv';
  }else{
    txt='Day Log – all entries ('+L.length+')\nExported '+stamp+'\n\n'+L.map((x,i)=>(i+1)+'. '+x.e.task+(x.e.mins?' ('+fmt(x.e.mins)+')':'')+' | Began '+bg(x)+' | '+st(x)).join('\n')+'\n';
    name='day-log-'+stamp+'.txt';type='text/plain';
  }
  const f=new File([txt],name,{type});
  if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
  const a=el('a'),u=URL.createObjectURL(f);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);
}
$('#dtx').onclick=()=>exp('txt');$('#dcs').onclick=()=>exp('csv');

// nav + settings
document.querySelectorAll('.seg2 button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;render();scrollTo(0,0)});
$('#prev').onclick=()=>{day.setDate(day.getDate()-(mode==='day'?1:7));load()};
$('#next').onclick=()=>{day.setDate(day.getDate()+(mode==='day'?1:7));load()};
const TC={blue:'#DCEBFF',green:'#D8F3E6',pink:'#FFD9E8'};
function setT(t){document.documentElement.dataset.t=t;S('dls:t',t);document.querySelectorAll('#th button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelector('meta[name=theme-color]').content=TC[t]}
document.querySelectorAll('#th button').forEach(b=>b.onclick=()=>setT(b.dataset.t));
$('#lv').checked=localV;$('#vo').checked=voiceOn;
$('#lv').onchange=()=>{localV=$('#lv').checked;S('dls:lv',localV?'1':'0')};
$('#vo').onchange=()=>{voiceOn=$('#vo').checked;S('dls:vo',voiceOn?'1':'0')};
$('#wipe').onclick=()=>{if(!confirm('Erase every entry saved on this phone? This can’t be undone.'))return;dayKeys().forEach(k=>{try{localStorage.removeItem('daylog:'+k)}catch(e){}});load();say('All entries erased.')};
setT(document.documentElement.dataset.t);
load();
$('#off').textContent='Offline mode isn’t active yet. Open the app once with internet.';
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.ready.then(()=>{$('#off').textContent='App works offline. Voice offline needs a browser with on-device speech; otherwise use your keyboard’s mic key.'})}}catch(e){}
</script>
</body>
</html>
