<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFD9E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Day Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Day Log</title>
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--ink:#000000;--mute:#8E8E93;--sep:#C6C6C8;--blue:#FF2D78;--red:#B4125A;--fill:rgba(255,255,255,.75);color-scheme:light only;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(280px 240px at 100% 0,#FFB3D1,transparent 70%) no-repeat,radial-gradient(240px 200px at 0 150px,#EBD9FF,transparent 70%) no-repeat,linear-gradient(180deg,#FFD9E8 0,#FFEEF4 300px) no-repeat #FFF5F9;color:var(--ink);font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;padding:0 16px 210px;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 50%,transparent);outline-offset:2px}
svg{display:block}
.top{display:flex;justify-content:space-between;height:44px;align-items:center}
.nav{width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
.nav svg{width:12px;height:20px}
.nav:disabled{color:var(--sep);cursor:default}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.37px}
.sub{color:#B83A72;font-size:15px;margin:2px 0 18px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,226,239,.82));border:1px solid rgba(255,45,120,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 10px 30px rgba(255,45,120,.15)}
.sum{padding:16px}
.lbl{font-size:13px;color:var(--mute)}
.total{color:var(--blue);font-size:40px;line-height:1.1;font-weight:700;letter-spacing:.3px;margin:2px 0 14px}
.total small{font-size:15px;font-weight:400;color:var(--mute);margin-left:8px;letter-spacing:0}
.seg{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--fill)}
.seg i{display:block;height:100%}
.leg{list-style:none;margin:14px 0 0;padding:0}
.leg li{display:flex;align-items:center;gap:10px;padding:6px 0}
.leg b{width:10px;height:10px;border-radius:50%;flex:none}
.leg span{flex:1;min-width:0;overflow-wrap:anywhere}
.leg em{font-style:normal;color:var(--mute)}
h2{margin:26px 0 7px 16px;font-size:13px;font-weight:400;color:#B83A72;text-transform:uppercase;letter-spacing:.2px}
.log{list-style:none;margin:0;padding:0;overflow:hidden}
.log li{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 4px 8px 16px}
.log li+li::before{content:"";position:absolute;top:0;left:62px;right:0;height:.5px;background:rgba(255,45,120,.18)}
.tile{flex:none;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:19px}
.main{flex:1;min-width:0}
.main div{overflow-wrap:anywhere}
.main small{color:var(--mute);font-size:13px}
.dur{color:var(--mute);white-space:nowrap}
.del{width:40px;height:40px;display:grid;place-items:center;color:var(--mute)}
.del svg{width:20px;height:20px}
.empty{padding:22px 16px;color:var(--mute);text-align:center}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,244,249,.92);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid #F3C6D8;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock>div{max-width:560px;margin:0 auto}
#say{margin:0 0 8px;font-size:13px;color:var(--mute);text-align:center;min-height:17px}
.ctl{display:flex;gap:12px;align-items:center}
#mic{flex:none;width:68px;height:68px;border-radius:50%;background:linear-gradient(160deg,#FF86B5,#FF2D78);box-shadow:0 0 0 6px rgba(255,45,120,.12),0 10px 28px rgba(255,45,120,.45);color:#fff;display:grid;place-items:center}
#mic svg{width:28px;height:28px}
#mic.on{background:var(--red);box-shadow:0 0 0 7px color-mix(in srgb,var(--red) 22%,transparent)}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--card);border:.5px solid #F3C6D8;border-radius:22px;padding:5px 5px 5px 14px}
#box{flex:1;min-width:0;height:44px;border:0;resize:none;background:none;padding:10px 0;line-height:1.25}
#box:focus-visible{outline:0}
#go{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
#go svg{width:16px;height:16px}
.priv{padding:16px;font-size:15px}.priv p{margin:0 0 10px}.opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}.opt input{width:22px;height:22px;accent-color:var(--blue);flex:none;margin:0}.wipe{color:var(--red);font-size:16px;font-weight:600;min-height:44px}
.seg2{display:flex;background:rgba(255,45,120,.10);border-radius:10px;padding:2px;margin:4px 0 14px}.seg2 button{flex:1;height:32px;border-radius:8px;font-size:14px;font-weight:600}.seg2 button.on{background:#fff;box-shadow:0 1px 4px rgba(255,45,120,.25)}
.week .dock,.week .dayonly{display:none}body:not(.week) .weekonly{display:none}.week{padding-bottom:40px}.wk h2{display:flex;justify-content:space-between;margin-right:16px}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="nav" id="prev" aria-label="Previous day"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg></button>
    <button class="nav" id="next" aria-label="Next day"><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg></button>
  </div>
  <div class="seg2"><button id="vday" class="on">Day</button><button id="vweek">Week</button></div>
  <h1 id="title"></h1>
  <div class="sub" id="date"></div>
  <section class="card sum">
    <div class="lbl">Time tracked</div>
    <div class="total"><span id="total">0m</span><small id="count"></small></div>
    <div class="seg" id="seg"></div>
    <ul class="leg" id="leg"></ul>
  </section>
  <div class="dayonly"><h2>Activity log</h2><ul class="card log" id="log"></ul></div>
  <div class="weekonly wk" id="wk"></div>
  <h2>Privacy</h2>
  <section class="card priv">
    <p>Entries stay on this phone. This page can’t send anything over the internet.</p>
    <p class="lbl" id="off"></p>
    <label class="opt"><input type="checkbox" id="vo"><span>Use the in-app voice button (needs internet, and Apple may process the audio)</span></label>
    <button class="wipe" id="wipe">Erase all entries on this phone</button>
  </section>
</main>
<div class="dock"><div>
  <p id="say" aria-live="polite">Tap the mic, then your keyboard’s mic key, and speak. Entries stay on this phone.</p>
  <div class="ctl">
    <button id="mic" aria-label="Start talking"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14.5a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5a3.5 3.5 0 0 0 3.5 3.5Z"/><path d="M5.5 10.5a1 1 0 0 1 2 0v.5a4.5 4.5 0 0 0 9 0v-.5a1 1 0 0 1 2 0v.5a6.5 6.5 0 0 1-5.5 6.42V20h2a1 1 0 0 1 0 2h-6a1 1 0 0 1 0-2h2v-2.58A6.5 6.5 0 0 1 5.5 11v-.5Z"/></svg></button>
    <div class="field">
      <textarea id="box" placeholder="Or type here" aria-label="Describe an activity"></textarea>
      <button id="go" aria-label="Log it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
    </div>
  </div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?(r?h+'h '+r+'m':h+'h'):r+'m'};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const say=t=>{$('#say').textContent=t};
const PAL=['#FF2D78','#AF52DE','#FF9500','#FF7AAE','#5AC8FA','#34C759','#C2185B','#FFCC00'];
const colorFor=s=>{let h=0;for(const c of s.toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const EM=[[/meet|call|zoom|sync/,'📞'],[/mail|inbox/,'✉️'],[/report|write|draft|doc/,'📝'],[/lunch|eat|coffee|break/,'☕️'],[/code|debug|build|develop/,'💻'],[/review|check/,'🔍'],[/plan|strategy|schedule/,'🗓️'],[/travel|drive|commute/,'🚗']];
const iconFor=s=>{const m=EM.find(([r])=>r.test(s.toLowerCase()));return m?m[1]:'📝'};
const TRASH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg>';
let day=new Date(),entries=[];

let mode='day';
const wkStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
function weekData(){
  const s=wkStart(day),out=[];
  for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);let en=[];try{en=JSON.parse(localStorage.getItem('daylog:'+key(d)))||[]}catch(e){}out.push({d,en})}
  return out;
}
function summary(list){
  const total=list.reduce((a,e)=>a+(e.mins||0),0);
  $('#total').textContent=fmt(total);
  $('#count').textContent=list.length+(list.length===1?' entry':' entries');
  const g=new Map();
  for(const e of list){const k=e.task.toLowerCase();const o=g.get(k)||{label:e.task,mins:0};o.mins+=e.mins||0;g.set(k,o)}
  const rows=[...g.values()].filter(o=>o.mins>0).sort((a,b)=>b.mins-a.mins);
  const seg=$('#seg'),leg=$('#leg');seg.replaceChildren();leg.replaceChildren();
  for(const o of rows){
    const c=colorFor(o.label),i=el('i');i.style.width=(o.mins/total*100)+'%';i.style.background=c;seg.append(i);
    const li=el('li'),d=el('b');d.style.background=c;li.append(d,el('span',0,o.label),el('em',0,fmt(o.mins)));leg.append(li);
  }
}
function row(e,del){
  const li=el('li'),t=el('span','tile',e.icon||iconFor(e.task));
  t.style.background='color-mix(in srgb,'+colorFor(e.task)+' 16%,white)';
  const m=el('div','main');m.append(el('div',0,e.task),el('small',0,e.at));
  li.append(t,m,el('span','dur',e.mins?fmt(e.mins):''));
  if(del){
    const d=el('button','del');d.innerHTML=TRASH;d.setAttribute('aria-label','Delete entry');
    d.onclick=()=>{entries=entries.filter(x=>x.id!==e.id);render();save()};
    li.append(d);
  }
  return li;
}
function render(){
  document.body.classList.toggle('week',mode==='week');
  $('#vday').classList.toggle('on',mode==='day');$('#vweek').classList.toggle('on',mode==='week');
  const now=new Date(),short={month:'short',day:'numeric'};
  if(mode==='day'){
    const today=key(day)===key(now);
    $('#title').textContent=today?'Today':day.toLocaleDateString(undefined,{weekday:'long'});
    $('#date').textContent=day.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
    $('#next').disabled=today;
    summary(entries);
    const ll=$('#log');ll.replaceChildren();
    if(!entries.length)ll.append(el('li','empty','Nothing logged yet. Tap the mic and say what you did.'));
    for(const e of entries)ll.append(row(e,true));
  }else{
    const w=weekData(),s=w[0].d,cur=key(wkStart(now))===key(s);
    $('#title').textContent=cur?'This week':'Week of '+s.toLocaleDateString(undefined,short);
    $('#date').textContent=s.toLocaleDateString(undefined,short)+' – '+w[6].d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
    $('#next').disabled=cur||s>now;
    const all=w.flatMap(x=>x.en);
    summary(all);
    const box=$('#wk');box.replaceChildren();
    for(const x of w){
      if(!x.en.length)continue;
      const tot=x.en.reduce((a,e)=>a+(e.mins||0),0),h=el('h2');
      h.append(el('span',0,x.d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'})),el('span',0,tot?fmt(tot):''));
      const ul=el('ul','card log');for(const e of x.en)ul.append(row(e,false));
      box.append(h,ul);
    }
    if(!all.length)box.append(el('div','empty','Nothing logged this week.'));
  }
}

function load(){try{entries=JSON.parse(localStorage.getItem('daylog:'+key(day)))||[]}catch(e){entries=[]}render()}
function save(){try{localStorage.setItem('daylog:'+key(day),JSON.stringify(entries))}catch(e){say('Couldn’t save on this device. Entries may be lost when you close the page.')}}

function dur(s){
  let m=0,r=s;
  r=r.replace(/an hour and a half|one and a half hours?/gi,()=>{m+=90;return ' '});
  r=r.replace(/half an hour|half hour/gi,()=>{m+=30;return ' '});
  r=r.replace(/\b(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)(?:\s*(?:and\s*)?(\d+)\s*(?:minutes?|mins?))?/gi,(_,h,mi)=>{m+=parseFloat(h)*60+(mi?+mi:0);return ' '});
  r=r.replace(/\b(\d+)\s*(?:minutes?|mins?)\b/gi,(_,n)=>{m+=+n;return ' '});
  r=r.replace(/\b(?:an|one) hour\b/gi,()=>{m+=60;return ' '});
  return {m:m||null,rest:r};
}
function clean(s,orig){
  let t=s.replace(/\s+/g,' ').trim(),p;
  const lead=/^(?:i|i’m|i'm|i’ve|i've|just|spent|spend|worked|working|on|for|about|around|and|had|did|doing|was|in|at|a bit|some)\b[\s,]*/i;
  do{p=t;t=t.replace(lead,'')}while(t!==p);
  t=t.replace(/[\s,]*\b(?:for|about|around)\s*$/i,'').replace(/^[\s,]+|[\s,]+$/g,'');
  if(!t)t=orig.trim();
  return (t.charAt(0).toUpperCase()+t.slice(1)).slice(0,60);
}
function parse(text){
  const parts=text.split(/\s*(?:\band then\b|\bthen\b|\bafter that\b|\bafterwards\b|[.;])\s*/i).map(x=>x.trim()).filter(Boolean);
  return (parts.length?parts:[text]).map(p=>{const d=dur(p),task=clean(d.rest,p);return {task,minutes:d.m,icon:iconFor(task)}});
}
function submit(){
  const text=$('#box').value.trim();
  if(!text)return;
  const at=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  for(const it of parse(text))entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),at,task:it.task,mins:it.minutes,icon:it.icon});
  $('#box').value='';render();save();
  say('Logged. Tap the mic for the next one.');
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
$('#mic').onclick=()=>{
  if(!voiceOn||!SR||!navigator.onLine){$('#box').focus();say('Tap the microphone key on your keyboard, speak, then tap the arrow.');return}
  if(listening){rec.stop();return}
  rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=true;rec.continuous=false;
  let heard='';
  rec.onstart=()=>{listening=true;$('#mic').classList.add('on');say('Listening… tap again when you’re done.')};
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;heard=t;$('#box').value=t};
  rec.onerror=e=>say(e.error==='not-allowed'||e.error==='service-not-allowed'?'Mic is blocked. Use your keyboard’s mic in the box instead.':e.error==='no-speech'?'Didn’t catch anything. Try again.':'Voice problem: '+e.error);
  rec.onend=()=>{listening=false;$('#mic').classList.remove('on');if(heard.trim())submit()};
  try{rec.start()}catch(e){say('Couldn’t start the mic.')}
};
$('#go').onclick=submit;
$('#prev').onclick=()=>{day.setDate(day.getDate()-(mode==='day'?1:7));load()};
$('#vday').onclick=()=>{mode='day';render()};
$('#vweek').onclick=()=>{mode='week';render()};
$('#next').onclick=()=>{day.setDate(day.getDate()+(mode==='day'?1:7));load()};
load();
let voiceOn=false;
try{voiceOn=localStorage.getItem('daylog:voice')==='1'}catch(e){}
$('#vo').checked=voiceOn;
$('#vo').onchange=()=>{voiceOn=$('#vo').checked;try{localStorage.setItem('daylog:voice',voiceOn?'1':'0')}catch(e){}};
$('#wipe').onclick=()=>{if(!confirm('Erase every entry saved on this phone? This can’t be undone.'))return;try{Object.keys(localStorage).filter(k=>k.startsWith('daylog:')&&k!=='daylog:voice').forEach(k=>localStorage.removeItem(k))}catch(e){}entries=[];render();say('All entries erased.')};
$('#off').textContent='Offline mode isn’t active yet. Open the app once with internet.';
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
try{if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.ready.then(()=>{$('#off').textContent='Ready to work offline.'})}}catch(e){}
</script>
</body>
</html>
